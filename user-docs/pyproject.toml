[project]
name = "exasol-personal-user-docs"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "mike>=2",
    "mkdocs-material>=9",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint]
extend-ignore = [
    "D100", # The small script and tests do not need module docstrings.
    "D101", # The domain exception name is self-explanatory.
    "D103", # Test names already describe their behavior.
]
